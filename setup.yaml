services:
  db:
    image: postgres:18.7@sha256:9f4fd4aa918f52ae3d6f3b687f1de90d8f867cd4d520021545a9a50c120eae3b
    restart: always
    ports:
      - 5432:5432
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: main
    volumes:
      - pgdata:/var/lib/postgresql # 18+ keeps PGDATA in a versioned subdirectory
volumes:
  pgdata:
